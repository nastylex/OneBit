<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OneBEAT — Admin Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307070b'/%3E%3Cpath d='M12 9.5v13M12 13l11-3.5v13' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070b;--bg-soft:#0c0c13;--surface:rgba(255,255,255,.04);--surface-strong:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09);--text:#f4f4f8;--muted:#9d9dab;
  --brand:#a855f7;--brand-2:#ec4899;--brand-3:#f97316;
  --grad:linear-gradient(120deg,#a855f7,#ec4899 55%,#f97316);
  --grad-soft:linear-gradient(120deg,rgba(168,85,247,.16),rgba(236,72,153,.16));
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;
  --radius:14px;--radius-sm:10px;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sidebar-w:260px;
}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
img,svg{display:block}
a{color:inherit;text-decoration:none}
::selection{background:rgba(168,85,247,.4);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}

/* ===== SIDEBAR ===== */
.sidebar{grid-row:1/3;display:flex;flex-direction:column;background:var(--bg-soft);border-right:1px solid var(--border);padding:16px 10px;gap:6px;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:8px}
.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grad);box-shadow:0 6px 20px -6px rgba(236,72,153,.55)}
.brand-mark svg{width:16px;height:16px;color:#fff}
.brand small{display:block;font-size:8px;letter-spacing:.3em;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-top:-3px}
.side-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:16px 12px 6px;user-select:none}
.side-label:first-of-type{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);font-size:13.5px;font-weight:600;border:0;background:none;text-align:left;width:100%;transition:all .2s var(--ease)}
.nav-item:hover{color:var(--text);background:var(--surface-strong)}
.nav-item.active{color:#fff;background:rgba(168,85,247,.18)}
.nav-item.active::before{content:"";position:absolute;left:0;width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--grad)}
.nav-item{position:relative}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--brand-2);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;min-width:20px;text-align:center}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 10px 6px}
.sidebar-footer .admin-info{display:flex;align-items:center;gap:10px}
.admin-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.admin-name{font-size:13px;font-weight:600}
.admin-role{font-size:11px;color:var(--muted)}

/* ===== MAIN ===== */
.main{grid-row:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:linear-gradient(to bottom,var(--bg) 70%,transparent);backdrop-filter:blur(12px)}
.topbar h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-search{position:relative}
.topbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.topbar-search input{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 14px 9px 36px;color:var(--text);font-size:13px;width:240px;outline:none;transition:border-color .2s}
.topbar-search input:focus{border-color:rgba(168,85,247,.5)}
.notif-btn{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;color:var(--muted);transition:all .2s}
.notif-btn:hover{color:var(--text);border-color:rgba(168,85,247,.4)}
.notif-btn svg{width:18px;height:18px}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brand-2);border:2px solid var(--bg)}

.content{padding:8px 28px 40px;flex:1}

/* ===== CARDS & GRID ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .3s var(--ease);position:relative;overflow:hidden}
.stat-card:hover{border-color:rgba(255,255,255,.16);transform:translateY(-2px)}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:0;transition:opacity .3s}
.stat-card:hover::before{opacity:1}
.stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.stat-card h3{font-size:26px;font-weight:700;font-family:var(--font-display);letter-spacing:-.03em}
.stat-card p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat-card .trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:99px}
.trend.up{color:var(--green);background:rgba(52,211,153,.1)}
.trend.down{color:var(--red);background:rgba(248,113,113,.1)}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;overflow:hidden}
.chart-card.full{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chart-head h3{font-size:15px;font-weight:700}
.chart-head select{background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;color:var(--text);font-size:12px}
.chart-area{position:relative;height:200px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100%;padding-bottom:24px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;background:var(--grad);min-height:4px;transition:height .5s var(--ease);position:relative;cursor:pointer}
.chart-bar:hover{opacity:.85}
.chart-bar::after{content:attr(data-val);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s}
.chart-bar:hover::after{opacity:1}
.chart-labels{display:flex;justify-content:space-between;position:absolute;bottom:0;left:0;right:0;font-size:10px;color:var(--muted)}

/* ===== TABLES ===== */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px;flex-wrap:wrap}
.table-head h3{font-size:15px;font-weight:700}
.table-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text);font-size:12px;cursor:pointer}
.filter-select option{background:var(--bg)}
.table-search{background:var(--surface-strong);border:1px solid var(--border);border-radius:999px;padding:7px 12px;color:var(--text);font-size:12px;width:180px;outline:none}
.table-search:focus{border-color:rgba(168,85,247,.5)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.table-avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;vertical-align:middle;margin-right:10px}
.table-artist-cell{display:flex;align-items:center;gap:0}
.table-scroll{overflow-x:auto}
.table-pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.page-btns{display:flex;gap:4px}
.page-btn{background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;color:var(--muted);font-size:12px;transition:all .2s}
.page-btn:hover,.page-btn.active{color:#fff;border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.15)}

/* ===== BADGES & STATUS ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge-green{color:var(--green);background:rgba(52,211,153,.12)}
.badge-yellow{color:var(--yellow);background:rgba(251,191,36,.12)}
.badge-red{color:var(--red);background:rgba(248,113,113,.12)}
.badge-blue{color:var(--blue);background:rgba(96,165,250,.12)}
.badge-purple{color:var(--brand);background:rgba(168,85,247,.12)}
.badge-gray{color:var(--muted);background:rgba(255,255,255,.06)}
.verified{color:var(--brand)}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px -6px rgba(236,72,153,.5)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(236,72,153,.65)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-strong);border-color:rgba(255,255,255,.18)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.25)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-success{background:rgba(52,211,153,.12);color:var(--green);border-color:rgba(52,211,153,.25)}
.btn-success:hover{background:rgba(52,211,153,.2)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.action-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--muted);transition:all .2s}
.action-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:var(--surface-strong)}
.action-btn svg{width:14px;height:14px}
.action-btn.del:hover{color:var(--red);border-color:rgba(248,113,113,.4)}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(7,7,11,.75);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:min(600px,95%);max-height:90vh;background:linear-gradient(180deg,rgba(20,20,32,.98),rgba(12,12,20,.99));border:1px solid var(--border);border-radius:20px;padding:28px;overflow-y:auto;transform:translateY(20px);transition:transform .3s var(--ease)}
.modal-backdrop.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h2{font-family:var(--font-display);font-size:20px;font-weight:700}
.modal-close{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;color:var(--muted);transition:all .2s}
.modal-close:hover{color:var(--text);border-color:rgba(168,85,247,.5)}
.modal-close svg{width:16px;height:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(168,85,247,.5)}
.form-group select option{background:var(--bg)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ===== ACTIVITY FEED ===== */
.activity-list{display:grid;gap:2px}
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);transition:background .2s}
.activity-item:hover{background:var(--surface)}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.activity-text{font-size:13px;line-height:1.5}
.activity-text strong{color:var(--text)}
.activity-time{font-size:11px;color:var(--muted);margin-top:2px}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;align-items:center;gap:10px;background:rgba(20,20,32,.95);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;font-size:13px;font-weight:500;box-shadow:0 20px 60px -12px rgba(0,0,0,.8);backdrop-filter:blur(16px);transform:translateY(80px);opacity:0;transition:all .4s var(--ease);max-width:380px}
.toast.show{transform:none;opacity:1}
.toast svg{width:18px;height:18px;flex-shrink:0}

/* ===== EMPTY ===== */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 14px;opacity:.4}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}

/* ===== REPORTS ===== */
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.report-body{font-size:13px;color:var(--muted);line-height:1.6}

/* ===== SETTINGS ===== */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px}
.toggle{position:relative;width:44px;height:24px;border-radius:99px;background:var(--surface-strong);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.toggle.on{background:var(--brand);border-color:var(--brand)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13.5px;font-weight:500}
.setting-desc{font-size:12px;color:var(--muted);margin-top:2px}

/* ===== NOTIFICATION PANEL ===== */
.notif-panel{position:fixed;top:0;right:-400px;width:380px;height:100vh;z-index:90;background:var(--bg-soft);border-left:1px solid var(--border);padding:20px;overflow-y:auto;transition:right .35s var(--ease);box-shadow:-20px 0 60px -20px rgba(0,0,0,.6)}
.notif-panel.open{right:0}
.notif-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.notif-head h3{font-size:16px;font-weight:700}
.notif-item{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;background:var(--surface);transition:all .2s}
.notif-item.unread{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.06)}
.notif-item h4{font-size:13px;font-weight:600;margin-bottom:4px}
.notif-item p{font-size:12px;color:var(--muted);line-height:1.5}
.notif-item .notif-time{font-size:11px;color:var(--muted);margin-top:6px}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;width:var(--sidebar-w);transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:20px 0 60px -20px rgba(0,0,0,.7)}.sidebar.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.show{opacity:1;pointer-events:auto}.hamburger{display:flex!important}.chart-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
@media(max-width:768px){.content{padding:8px 14px 40px}.topbar{padding:10px 14px}.form-row{grid-template-columns:1fr}.topbar-search input{width:160px}}
.hamburger{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;color:var(--text)}
.hamburger svg{width:18px;height:18px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .4s var(--ease) both}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9.5v13M12 13l11-3.5v13"/></svg></span>
      <span>OneBEAT<small>ADMIN</small></span>
    </a>
    <div class="side-label">Main</div>
    <button class="nav-item active" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</button>
    <div class="side-label">Management</div>
    <button class="nav-item" data-page="artists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Artists<span class="nav-badge" id="artistBadge">7</span></button>

/* ===== LOAD / SAVE ===== */
function load(key,def){try{var v=localStorage.getItem("ob_admin_"+key);return v?JSON.parse(v):def}catch(e){return def}}
function save(key,val){try{localStorage.setItem("ob_admin_"+key,JSON.stringify(val))}catch(e){}}

function persist(){

/* ===== HELPERS ===== */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+"B";if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return n.toString()}
function fmtDur(s){var m=Math.floor(s/60);return m+":"+(s%60<10?"0":"")+(s%60)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function initials(name){return name.split(" ").map(function(w){return w[0]}).join("").substring(0,2).toUpperCase()}
function statusBadge(s){var map={pending:"badge-yellow",under_review:"badge-blue",approved:"badge-green",rejected:"badge-red",changes_requested:"badge-yellow",suspended:"badge-red",draft:"badge-gray",published:"badge-green",pending_review:"badge-yellow",new:"badge-red",under_review2:"badge-blue",resolved:"badge-green",dismissed:"badge-gray"};return '<span class="badge '+(map[s]||"badge-gray")+'">'+esc(s.replace(/_/g," "))+'</span>'}
function roleBadge(r){var map={super_admin:"badge-purple",content_admin:"badge-blue",artist_manager:"badge-green",analytics_admin:"badge-yellow",finance_admin:"badge-red"};var labels={super_admin:"Super Admin",content_admin:"Content Admin",artist_manager:"Artist Manager",analytics_admin:"Analytics Admin",finance_admin:"Finance Admin"};return '<span class="badge '+(map[r]||"badge-gray")+'">'+esc(labels[r]||r)+'</span>'}

function addActivity(action,subject,admin,type){
  activity.unshift({id:genId(),action:action,subject:subject,admin:admin,time:"Just now",type:type||"info"});
  if(activity.length>100)activity=activity.slice(0,100);
  persist();
}

function showToast(msg){
  var t=$("#toast");
  t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>'+esc(msg)+'</span>';
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show")},3500);
}

/* ---------- ANALYTICS ---------- */
pages.analytics=function(){
  var totalStreams=songs.reduce(function(s,song){return s+song.streams},0);
  var published=songs.filter(function(s){return s.status==="published"});
  var topArtists=artists.slice().sort(function(a,b){return b.streams-a.streams}).slice(0,6);
  var topGenres={};songs.forEach(function(s){if(!topGenres[s.genre])topGenres[s.genre]=0;topGenres[s.genre]+=s.streams});
  var genreSorted=Object.keys(topGenres).sort(function(a,b){return topGenres[b]-topGenres[a]});
  var maxGenre=topGenres[genreSorted[0]]||1;

  var dailyStreams=[4.2,4.5,4.1,4.8,5.2,5.5,5.1,5.8,6.2,6.0,5.7,6.1,6.5,6.3,6.8,7.0,6.9,7.2,7.5,7.1,7.4,7.8,8.0,7.6,7.9,8.2,8.5,8.1,8.4,8.7];
  var maxDaily=Math.max.apply(null,dailyStreams);

  return '<div class="chart-grid">'+
    '<div class="chart-card full"><div class="chart-head"><h3>Daily Streams (Millions)</h3><div class="table-filters"><select class="filter-select" id="analyticsPeriod"><option>Last 30 days</option><option>Last 7 days</option><option>Last 90 days</option></select><select class="filter-select"><option>All Artists</option>'+artists.map(function(a){return '<option>'+esc(a.stageName)+'</option>'}).join("")+'</select><select class="filter-select"><option>All Genres</option>'+GENRES.map(function(g){return '<option>'+g+'</option>'}).join("")+'</select></div></div><div class="chart-area"><div class="chart-bars">'+dailyStreams.map(function(v,i){return '<div class="chart-bar" style="height:'+(v/maxDaily*100)+'%;opacity:'+(0.5+i/dailyStreams.length*0.5)+'" data-val="'+v+'M"></div>'}).join("")+'</div><div class="chart-labels"><span>1</span><span>7</span><span>14</span><span>21</span><span>30</span></div></div></div>'+

    '<div class="chart-card"><div class="chart-head"><h3>Top Artists by Streams</h3></div><div style="display:grid;gap:10px">'+topArtists.map(function(a,i){
      var pct=Math.round((a.streams/topArtists[0].streams)*100);
      return '<div style="display:flex;align-items:center;gap:10px"><span class="table-avatar" style="background:'+a.avatar+';width:28px;height:28px;font-size:9px">'+esc(initials(a.stageName))+'</span><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12.5px;font-weight:600">'+esc(a.stageName)+'</span><span style="font-size:11px;color:var(--muted)">'+fmt(a.streams)+'</span></div><div style="height:3px;border-radius:3px;background:var(--surface-strong);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--grad);border-radius:3px"></div></div></div></div>';
    }).join("")+'</div></div>'+

    '<div class="chart-card"><div class="chart-head"><h3>Genre Distribution</h3></div><div style="display:grid;gap:10px">'+genreSorted.slice(0,6).map(function(g){
      var pct=Math.round((topGenres[g]/maxGenre)*100);
      return '<div><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12.5px;font-weight:600">'+esc(g)+'</span><span style="font-size:11px;color:var(--muted)">'+fmt(topGenres[g])+' streams</span></div><div style="height:6px;border-radius:3px;background:var(--surface-strong);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--grad);border-radius:3px"></div></div></div>';
    }).join("")+'</div></div>'+

    '<div class="chart-card full"><div class="chart-head"><h3>Key Metrics</h3></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px">'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">'+fmt(totalStreams)+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Total Streams</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">3.2min</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Avg Listen Time</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">67%</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Engagement Rate</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">'+artists.length+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Active Artists</div></div>'+

/* ===== PAGE EVENT BINDING ===== */
function bindPageEvents(){
  // Artist table actions
  $$("[data-action]").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var action=btn.dataset.action;
      var id=btn.dataset.id;
      handleAction(action,id);
    });
  });

  // Music tabs
  $$("[data-music-tab]").forEach(function(btn){
    btn.addEventListener("click",function(){
      $$("[data-music-tab]").forEach(function(b){b.classList.remove("active")});
      btn.classList.add("active");
      var tab=btn.dataset.musicTab;
      var songsTab=$("#musicTabSongs");
      var albumsTab=$("#musicTabAlbums");
      if(tab==="songs"){songsTab.style.display="";albumsTab.style.display="none"}
      else{songsTab.style.display="none";albumsTab.style.display=""}
    });
  });

  // Featured content save
  var saveFeatBtn=$("#saveFeatured");
  if(saveFeatBtn){
    saveFeatBtn.addEventListener("click",function(){
      var fa=$("#featArtist");
      var fs=$("#featSong");
      var fal=$("#featAlbum");
      var gs=$("#genreSpotlight");
      if(fa)featured.featuredArtist=fa.value;
      if(fs)featured.featuredSong=fs.value;
      if(fal)featured.featuredAlbum=fal.value;
      if(gs)featured.genreSpotlight=gs.value;
      persist();
      showToast("Featured content updated successfully");
    });
  }

  // Settings save
  var saveSettBtn=$("#saveSettings");
  if(saveSettBtn){
    saveSettBtn.addEventListener("click",function(){
      var name=$("#settName");
      var limit=$("#settUploadLimit");
      var bioMax=$("#settBioMax");
      var email=$("#settCopyrightEmail");
      if(name)settings.platformName=name.value;
      if(limit)settings.uploadLimitMB=parseInt(limit.value)||50;
      if(bioMax)settings.maxBioLength=parseInt(bioMax.value)||2000;
      if(email)settings.copyrightClaimEmail=email.value;
      persist();
      showToast("Settings saved successfully");
    });
  }

  // Toggle maintenance
  var toggleMaint=$("#toggleMaintenance");
  if(toggleMaint){
    toggleMaint.addEventListener("click",function(){
      settings.maintenanceMode=!settings.maintenanceMode;
      toggleMaint.classList.toggle("on",settings.maintenanceMode);
      persist();
      showToast(settings.maintenanceMode?"Maintenance mode enabled":"Maintenance mode disabled");
    });
  }
  var toggleReg=$("#toggleRegistrations");
  if(toggleReg){
    toggleReg.addEventListener("click",function(){
      settings.registrations=!settings.registrations;
      toggleReg.classList.toggle("on",settings.registrations);
      persist();
      showToast(settings.registrations?"Registrations enabled":"Registrations disabled");
    });
  }

  // Trending toggles
  $$("[data-toggle-trending]").forEach(function(tog){
    tog.addEventListener("click",function(){
      var sid=tog.dataset.toggleTrending;
      var idx=featured.trendingSongs.indexOf(sid);
      if(idx>-1)featured.trendingSongs.splice(idx,1);
      else if(featured.trendingSongs.length<10)featured.trendingSongs.push(sid);
      tog.classList.toggle("on",featured.trendingSongs.indexOf(sid)>-1);
      persist();
    });
  });

  // Mark all notifications read
  var markAllBtn=$("#markAllRead");
  if(markAllBtn){
    markAllBtn.addEventListener("click",function(){
      notifications.forEach(function(n){n.read=true});
      persist();
      renderPage();
      showToast("All notifications marked as read");
    });
  }

  // Add admin
  var addAdminBtn=$("#addAdminBtn");
  if(addAdminBtn){
    addAdminBtn.addEventListener("click",function(){
      openModal('<div class="modal-head"><h2>Add Administrator</h2><button class="modal-close" onclick="document.getElementById(\'modalBg\').classList.remove(\'open\')">'+I.x+'</button></div>'+
        '<div class="form-group"><label>Name</label><input id="newAdminName" placeholder="Full name"/></div>'+
        '<div class="form-group"><label>Email</label><input id="newAdminEmail" type="email" placeholder="Email address"/></div>'+
        '<div class="form-group"><label>Role</label><select id="newAdminRole"><option value="content_admin">Content Admin</option><option value="artist_manager">Artist Manager</option><option value="analytics_admin">Analytics Admin</option><option value="finance_admin">Finance Admin</option></select></div>'+
        '<button class="btn btn-primary" onclick="window._addAdmin()">Create Account</button>');
    });
  }

  // Artist search — only bind once
  if(!window._searchBound){
    var artistSearch=$("#artistSearch");
    if(artistSearch){
      artistSearch.addEventListener("input",function(){
        filterArtistTable();
      });
    }
    // Filter selects — only bind once
    ["filterGenre","filterStatus","filterCountry","filterAppStatus","filterReportStatus"].forEach(function(id){
      var el=$("#"+id);
      if(el)el.addEventListener("change",function(){
        if(id==="filterGenre"||id==="filterStatus"||id==="filterCountry")filterArtistTable();
      });
    });
    window._searchBound=true;
  }

  // Nav links in content
  $$("[data-nav]").forEach(function(btn){
    btn.addEventListener("click",function(){setPage(btn.dataset.nav)});
  });
}

window._addAdmin=function(){
  var name=($("#newAdminName")||{}).value;
  var email=($("#newAdminEmail")||{}).value;
  var role=($("#newAdminRole")||{}).value;
  if(!name||!email){showToast("Please fill in all fields");return}
  admins.push({id:genId(),name:name,email:email,role:role||"content_admin",status:"active",lastLogin:"Never"});
  persist();
  closeModal();
  renderPage();
  showToast("Admin account created for "+name);
  addActivity("Admin account created",name,"Super Admin","approval");
};

function filterArtistTable(){
  var search=(($("#artistSearch")||{}).value||"").toLowerCase();
  var genre=($("#filterGenre")||{}).value||"";
  var status=($("#filterStatus")||{}).value||"";
  var country= ($("#filterCountry")||{}).value||"";
  var rows=$$("#artistTableBody tr");
  // re-render with filter
  var filtered=artists.filter(function(a){
    if(search && a.stageName.toLowerCase().indexOf(search)===-1 && a.email.toLowerCase().indexOf(search)===-1)return false;
    if(genre && a.genre!==genre)return false;
    if(status && a.status!==status)return false;
    if(country && a.country!==country)return false;
    return true;
  });
  var tbody=$("#artistTableBody");
  if(tbody){
    tbody.innerHTML=filtered.map(function(a){
      return '<tr>'+
        '<td><div class="table-artist-cell"><span class="table-avatar" style="background:'+a.avatar+'">'+esc(initials(a.stageName))+'</span><div><strong>'+esc(a.stageName)+'</strong>'+(a.verified?' <span class="verified">✓</span>':'')+'<br><span style="font-size:12px;color:var(--muted)">'+esc(a.genre)+'</span></div></div></td>'+
        '<td>'+esc(a.country)+'</td><td>'+fmt(a.followers)+'</td><td>'+a.songs+'</td><td>'+a.albums+'</td><td>'+fmt(a.streams)+'</td><td>'+statusBadge(a.status)+'</td><td>'+esc(a.regDate)+'</td>'+
        '<td><div class="action-btns"><button class="action-btn" data-action="view" data-id="'+a.id+'" title="View Profile">'+I.eye+'</button><button class="action-btn" data-action="edit" data-id="'+a.id+'" title="Edit">'+I.edit+'</button><button class="action-btn" data-action="verify" data-id="'+a.id+'" title="Verify">'+I.shield+'</button><button class="action-btn" data-action="suspend" data-id="'+a.id+'" title="Suspend">'+I.ban+'</button><button class="action-btn del" data-action="delete" data-id="'+a.id+'" title="Delete">'+I.trash+'</button></div></td></tr>';
    }).join("");
    bindPageEvents();
  }
}

/* ===== ACTIONS ===== */
function handleAction(action,id){
  switch(action){
    case"view":case"view_song":case"view_upload":
      var artist=artists.filter(function(a){return a.id===id})[0];
      var song=songs.filter(function(s){return s.id===id})[0];
      if(artist){
        openModal('<div class="modal-head"><h2>'+esc(artist.stageName)+'</h2><button class="modal-close" onclick="document.getElementById(\'modalBg\').classList.remove(\'open\')">'+I.x+'</button></div>'+
          '<div style="display:flex;gap:16px;align-items:center;margin-bottom:20px"><div style="width:80px;height:80px;border-radius:50%;background:'+artist.avatar+';display:grid;place-items:center;font-size:24px;font-weight:700">'+esc(initials(artist.stageName))+'</div><div><div style="font-size:18px;font-weight:700">'+esc(artist.stageName)+(artist.verified?' <span class="verified">✓ Verified</span>':'')+'</div><div style="color:var(--muted);font-size:13px">'+esc(artist.genre)+' · '+esc(artist.country)+' · '+esc(artist.type)+'</div></div></div>'+
          '<p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:20px">'+esc(artist.bio)+'</p>'+
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">'+
            '<div style="text-align:center;padding:12px;background:var(--surface);border-radius:10px"><div style="font-size:20px;font-weight:700">'+fmt(artist.followers)+'</div><div style="font-size:11px;color:var(--muted)">Followers</div></div>'+
            '<div style="text-align:center;padding:12px;background:var(--surface);border-radius:10px"><div style="font-size:20px;font-weight:700">'+artist.songs+'</div><div style="font-size:11px;color:var(--muted)">Songs</div></div>'+
            '<div style="text-align:center;padding:12px;background:var(--surface);border-radius:10px"><div style="font-size:20px;font-weight:700">'+artist.albums+'</div><div style="font-size:11px;color:var(--muted)">Albums</div></div>'+
            '<div style="text-align:center;padding:12px;background:var(--surface);border-radius:10px"><div style="font-size:20px;font-weight:700">'+fmt(artist.streams)+'</div><div style="font-size:11px;color:var(--muted)">Streams</div></div>'+
          '</div>'+
          '<div style="font-size:12px;color:var(--muted)"><strong>Email:</strong> '+esc(artist.email)+' · <strong>Label:</strong> '+esc(artist.label||"Independent")+' · <strong>Registered:</strong> '+esc(artist.regDate)+'</div>');
      }
      break;
    case"edit":case"edit_song":case"edit_admin":
      showToast("Edit mode opened — changes will be saved");
      break;
    case"verify":
      var ar=artists.filter(function(a){return a.id===id})[0];
      if(ar){ar.verified=!ar.verified;persist();renderPage();showToast(ar.stageName+(ar.verified?" verified":" verification removed"));addActivity("Artist verification toggled",ar.stageName,"Super Admin","approval")}
      break;
    case"suspend":
      var ar2=artists.filter(function(a){return a.id===id})[0];
      if(ar2){ar2.status="suspended";persist();renderPage();showToast(ar2.stageName+" suspended");addActivity("Artist suspended",ar2.stageName,"Super Admin","warning")}
      break;
    case"unsuspend":
      var ar3=artists.filter(function(a){return a.id===id})[0];
      if(ar3){ar3.status="approved";persist();renderPage();showToast(ar3.stageName+" reactivated");addActivity("Artist reactivated",ar3.stageName,"Super Admin","approval")}
      break;
    case"delete":
      if(confirm("Are you sure you want to delete this artist?")){
        artists=artists.filter(function(a){return a.id!==id});persist();renderPage();showToast("Artist deleted");
      }
      break;
    case"approve_app":
      var app=apps.filter(function(a){return a.id===id})[0];
      if(app){
        var colors=["linear-gradient(135deg,#a855f7,#ec4899)","linear-gradient(135deg,#60a5fa,#a78bfa)","linear-gradient(135deg,#34d399,#60a5fa)","linear-gradient(135deg,#fbbf24,#f97316)"];
        artists.push({id:genId(),stageName:app.stageName,legalName:app.stageName,email:app.email,phone:app.phone,country:app.country,location:app.location,type:app.type,genre:app.genre,bio:app.bio,verified:false,status:"approved",followers:0,songs:0,albums:0,streams:0,regDate:app.regDate,avatar:colors[Math.floor(Math.random()*colors.length)],socials:{},label:"Independent"});
        apps=apps.filter(function(a){return a.id!==id});persist();renderPage();showToast(app.stageName+" approved and added as artist");
        addActivity("Artist application approved",app.stageName,"Super Admin","approval");
      }
      break;
    case"review_app":
      showToast("Application review opened");
      break;
    case"request_changes":
      showToast("Changes request sent to applicant");
      addActivity("Changes requested",apps.filter(function(a){return a.id===id})[0].stageName,"Super Admin","warning");
      break;
    case"reject_app":
      var rejApp=apps.filter(function(a){return a.id===id})[0];
      if(rejApp){
        openModal('<div class="modal-head"><h2>Reject Application</h2><button class="modal-close" onclick="document.getElementById(\'modalBg\').classList.remove(\'open\')">'+I.x+'</button></div>'+
          '<p style="color:var(--muted);margin-bottom:14px">Provide a reason for rejecting <strong>'+esc(rejApp.stageName)+'</strong>\'s application:</p>'+
          '<div class="form-group"><textarea id="rejectReason" placeholder="Reason for rejection..."></textarea></div>'+
          '<div style="display:flex;gap:10px"><button class="btn btn-danger" onclick="window._confirmReject(\''+id+'\')">Confirm Rejection</button><button class="btn btn-ghost" onclick="document.getElementById(\'modalBg\').classList.remove(\'open\')">Cancel</button></div>');
      }
      break;
    case"approve_upload":
      var song=songs.filter(function(s){return s.id===id})[0];
      if(song){song.status="published";persist();renderPage();showToast(song.title+" approved and published");addActivity("Song approved",song.title,song.artist,"approval")}
      break;
    case"reject_upload":
      showToast("Upload rejected — artist notified");
      break;
    case"unpublish_song":
      var pubSong=songs.filter(function(s){return s.id===id})[0];
      if(pubSong){pubSong.status="pending_review";persist();renderPage();showToast(pubSong.title+" unpublished")}
      break;
    case"resolve_report":
      var rep=reports.filter(function(r){return r.id===id})[0];
      if(rep){rep.status="resolved";persist();renderPage();showToast("Report resolved");addActivity("Report resolved",rep.target,"Super Admin","approval")}
      break;
    case"dismiss_report":
      var disRep=reports.filter(function(r){return r.id===id})[0];
      if(disRep){disRep.status="dismissed";persist();renderPage();showToast("Report dismissed")}
      break;
    case"toggle_admin":
      var adm=admins.filter(function(a){return a.id===id})[0];
      if(adm){adm.status=adm.status==="active"?"inactive":"active";persist();renderPage();showToast(adm.name+(adm.status==="active"?" activated":" deactivated"))}
      break;
    case"review_report":
      showToast("Report details opened for review");
      break;
  }
}

window._confirmReject=function(id){
  var reason=(($("#rejectReason")||{}).value||"No reason provided");
  var app=apps.filter(function(a){return a.id===id})[0];
  if(app){app.status="rejected";persist();closeModal();renderPage();showToast(app.stageName+" application rejected");addActivity("Artist application rejected",app.stageName,"Super Admin","warning")}
};

/* ===== MODAL ===== */
function openModal(html){
  $("#modal").innerHTML=html;
  $("#modalBg").classList.add("open");
}
function closeModal(){
  $("#modalBg").classList.remove("open");
}
$("#modalBg").addEventListener("click",function(e){if(e.target===this)closeModal()});

/* ===== NOTIFICATIONS PANEL ===== */
function renderNotifPanel(){
  var html=notifications.map(function(n){
    var colors={info:"var(--blue)",warning:"var(--yellow)",success:"var(--green)"};
    return '<div class="notif-item'+(n.read?"":" unread")+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="activity-dot" style="background:'+(colors[n.type]||"var(--muted)")+'"></div><h4>'+esc(n.title)+'</h4></div><p>'+esc(n.message)+'</p><div class="notif-time">'+esc(n.time)+'</div></div>';
  }).join("");
  $("#notifList").innerHTML=html||'<div class="empty"><h3>No notifications</h3></div>';
}
$("#notifToggle").addEventListener("click",function(){
  $("#notifPanel").classList.toggle("open");
  renderNotifPanel();
});
$("#closeNotif").addEventListener("click",function(){$("#notifPanel").classList.remove("open")});

/* ===== SIDEBAR NAV ===== */
$$(".nav-item").forEach(function(btn){
  btn.addEventListener("click",function(){setPage(btn.dataset.page)});
});

/* ===== MOBILE ===== */
$("#hamburger").addEventListener("click",function(){$("#sidebar").classList.toggle("open");$("#scrim").classList.toggle("show")});
$("#scrim").addEventListener("click",function(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")});

/* ===== GLOBAL SEARCH ===== */
var gSearchTimer=null;
$("#globalSearch").addEventListener("input",function(){
  clearTimeout(gSearchTimer);
  var q=this.value.toLowerCase();
  gSearchTimer=setTimeout(function(){
    if(q.indexOf("artist")>-1||q.indexOf("artist")>-1)setPage("artists");
    else if(q.indexOf("upload")>-1)setPage("uploads");
    else if(q.indexOf("report")>-1)setPage("reports");
    else if(q.indexOf("setting")>-1)setPage("settings");
    else if(q.indexOf("analytic")>-1)setPage("analytics");
    else if(q.indexOf("revenue")>-1||q.indexOf("earning")>-1)setPage("revenue");
    else if(q.indexOf("application")>-1||q.indexOf("applic")>-1)setPage("applications");
    else if(q.indexOf("music")>-1||q.indexOf("song")>-1||q.indexOf("album")>-1)setPage("music");
  },300);
});

/* ===== BOOT ===== */
renderPage();

})();
</script>
</body>
</html>
