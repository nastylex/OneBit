<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneBEAT — Music Streaming</title>
<meta name="description" content="OneBEAT music streaming app — dark theme with vibrant accents, built for the beat." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b08'/%3E%3Cpath d='M12 9.5v13M12 13l11-3.5v13' fill='none' stroke='%232ee57c' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============ RESET & TOKENS ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #070b08;            /* near-black base */
    --bg-elev: #0c110d;
    --bg-card: #10160f;
    --bg-card-hover: #1a231b;
    --bg-pill: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.07);
    --text: #f0f6f1;
    --muted: #8ba08f;
    --accent: #2ee57c;        /* signature lime */
    --accent-deep: #17b26a;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
    --grad: linear-gradient(135deg, var(--accent), var(--accent-deep));
    --banner-grad: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, transparent), rgba(7,11,8,.4) 60%);
    --radius: 16px;
    --radius-sm: 12px;
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  /* ============ THEMES ============ */
  body[data-theme="peach"] { --accent: #ffb37e; --accent-deep: #ff8c5a; }
  body[data-theme="blue"]  { --accent: #5aa8ff; --accent-deep: #3b82f6; }
  body[data-theme="purple"]{ --accent: #a78bfa; --accent-deep: #8b5cf6; }

  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  img, svg { display: block; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.28); }
  ::-webkit-scrollbar-track { background: transparent; }

  .icon { width: 20px; height: 20px; flex-shrink: 0; }

  /* ============ APP SHELL ============ */
  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: 1fr auto;
    height: 100vh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    grid-row: 1 / 3;
    display: flex; flex-direction: column;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 20px 14px 12px;
    gap: 18px;
    overflow: hidden;
  }
  .brand {
    display: flex; align-items: center; gap: 11px;
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em;
    padding: 2px 8px;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--grad); box-shadow: 0 6px 20px -6px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .brand-mark svg { width: 17px; height: 17px; color: #04110a; }
  .brand small { display: block; font-size: 8.5px; letter-spacing: .3em; color: var(--muted); font-family: var(--font-body); font-weight: 600; margin-top: -3px; }

  .side-nav { display: grid; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 12px; border-radius: 12px;
    color: var(--muted); font-size: 14.5px; font-weight: 600;
    border: 0; background: none; text-align: left; width: 100%;
    transition: color .2s, background .2s, transform .2s var(--ease);
  }
  .nav-item:hover { color: var(--text); background: var(--bg-pill); transform: translateX(2px); }
  .nav-item.active { color: var(--accent); background: var(--accent-soft); }
  .nav-item.active svg { color: var(--accent); }

  .side-section {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: 0 12px;
  }
  .side-section button {
    background: none; border: 0; color: var(--muted); padding: 4px;
    transition: color .2s, transform .2s;
  }
  .side-section button:hover { color: var(--accent); transform: scale(1.15); }
  .side-section button svg { width: 16px; height: 16px; }

  .playlist-nav { list-style: none; display: grid; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 8px; }
  .playlist-nav li { display: flex; align-items: center; gap: 10px; }
  .playlist-nav button {
    flex: 1; display: flex; align-items: center; gap: 10px; overflow: hidden;
    background: none; border: 0; color: var(--muted);
    font-size: 13.5px; font-weight: 500; padding: 9px 12px; border-radius: 10px;
    transition: color .2s, background .2s;
  }
  .playlist-nav button:hover { color: var(--text); background: var(--bg-pill); }
  .playlist-nav button.active { color: var(--accent); background: var(--accent-soft); }
  .playlist-nav .pl-dot { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; }
  .playlist-nav .pl-dot svg { width: 13px; height: 13px; color: rgba(255,255,255,.85); }
  .playlist-nav .pl-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .side-foot { border-top: 1px solid var(--border); padding: 12px 8px 0; }
  .side-foot p { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .theme-row { display: flex; align-items: center; gap: 10px; padding: 0 12px; margin-bottom: 14px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(255,255,255,.15);
    transition: transform .2s var(--ease), border-color .2s, box-shadow .2s;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.22); }

  /* ============ MAIN ============ */
  .main { grid-row: 1; overflow-y: auto; min-width: 0; }
  .main-inner { max-width: 1560px; margin: 0 auto; padding: 18px 28px 90px; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0 16px;
    background: linear-gradient(to bottom, var(--bg) 62%, transparent);
  }
  .hamburger { display: none; background: var(--bg-pill); border: 1px solid var(--border); color: var(--text); padding: 9px; border-radius: 10px; }
  .hamburger svg { width: 19px; height: 19px; }
  .search-wrap { position: relative; flex: 1; max-width: 460px; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
  .search-wrap input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 11px 16px 11px 42px;
    color: var(--text); font-size: 14px; font-family: var(--font-body); outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .search-wrap input:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .upgrade-btn {
    background: none; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent);
    font-weight: 700; font-size: 12.5px; padding: 9px 18px; border-radius: 999px;
    transition: background .25s, color .25s, transform .25s var(--ease);
  }
  .upgrade-btn:hover { background: var(--accent); color: #04110a; transform: translateY(-1px); }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 5px 14px 5px 6px; border-radius: 999px; font-size: 13px; font-weight: 600;
    transition: border-color .2s;
  }
  .user-chip:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grad); color: #04110a; display: grid; place-items: center; font-weight: 700; font-size: 12px; }

  /* ============ VIEWS / SECTIONS ============ */
  .view-title { font-family: var(--font-display); font-size: clamp(26px, 3vw, 34px); font-weight: 700; letter-spacing: -.02em; margin-bottom: 18px; }
  .view-title .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .section { margin-top: 34px; }
  .section:first-child { margin-top: 6px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .section-head h2 { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .section-head .see-all { color: var(--muted); font-size: 12.5px; font-weight: 600; transition: color .2s; }
  .section-head .see-all:hover { color: var(--accent); }

  .h-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: 172px; gap: 16px; overflow-x: auto; padding: 4px 4px 14px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }

  /* track card */
  .track-card {
    scroll-snap-align: start;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; cursor: pointer;
    transition: background .3s var(--ease), transform .3s var(--ease), border-color .3s;
  }
  .track-card:hover { background: var(--bg-card-hover); transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
  .track-card.playing .tc-cover { box-shadow: 0 0 0 2px var(--accent), 0 14px 34px -10px color-mix(in srgb, var(--accent) 50%, transparent); }
  .tc-cover {
    position: relative; border-radius: 12px; aspect-ratio: 1; overflow: hidden; margin-bottom: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .tc-cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 60% at 25% 12%, rgba(255,255,255,.25), transparent 55%); }
  .tc-cover svg.note { position: absolute; inset: 0; margin: auto; width: 42%; height: 42%; color: rgba(255,255,255,.28); }
  .tc-play {
    position: absolute; right: 9px; bottom: 9px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent); color: #04110a; border: 0;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px -6px color-mix(in srgb, var(--accent) 60%, transparent);
    opacity: 0; transform: translateY(8px) scale(.8);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .tc-play svg { width: 18px; height: 18px; }
  .track-card:hover .tc-play, .track-card.playing .tc-play { opacity: 1; transform: none; }
  .tc-play:hover { transform: scale(1.1); }
  .track-card.playing .tc-play { background: var(--text); }
  .tc-like {
    position: absolute; top: 9px; right: 9px; z-index: 3;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,.4); border: 0; color: #fff; backdrop-filter: blur(6px);
    display: grid; place-items: center;
    opacity: 0; transform: scale(.7);
    transition: opacity .2s, transform .2s var(--ease), color .2s;
  }
  .track-card:hover .tc-like, .tc-like.liked { opacity: 1; transform: none; }
  .tc-like svg { width: 14px; height: 14px; }
  .tc-like.liked { color: var(--accent); opacity: 1; transform: none; }
  .tc-info h4 { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-info p { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-info .tc-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .tc-info .dur { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* mini equalizer for the playing card */
  .mini-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
  .track-card.playing .mini-eq { display: flex; }
  .mini-eq span { width: 3px; border-radius: 2px; background: var(--accent); height: 30%; animation: eq 1s ease-in-out infinite; }
  .mini-eq span:nth-child(2) { animation-delay: .15s; }
  .mini-eq span:nth-child(3) { animation-delay: .3s; }
  .mini-eq span:nth-child(4) { animation-delay: .45s; }
  @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
  .track-card:not(.playing) .mini-eq { display: none; }
  .track-card.playing .dur { display: none; }

  /* playlist card */
  .playlist-card {
    scroll-snap-align: start;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; cursor: pointer; text-align: left;
    transition: background .3s var(--ease), transform .3s var(--ease), border-color .3s;
  }
  .playlist-card:hover { background: var(--bg-card-hover); transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
  .pl-cover { position: relative; border-radius: 12px; aspect-ratio: 1; overflow: hidden; margin-bottom: 12px; display: grid; place-items: center; }
  .pl-cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 60% at 25% 12%, rgba(255,255,255,.22), transparent 55%); }
  .pl-cover svg { width: 34%; height: 34%; color: rgba(255,255,255,.9); }
  .playlist-card h4 { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist-card p { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* artist card */
  .artist-card {
    scroll-snap-align: start; background: none; border: 0; text-align: center; cursor: pointer;
    padding: 10px 8px; border-radius: var(--radius);
    transition: background .3s var(--ease), transform .3s var(--ease);
  }
  .artist-card:hover { background: var(--bg-card); transform: translateY(-4px); }
  .artist-avatar {
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    display: grid; place-items: center; margin-bottom: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 12px 30px -12px rgba(0,0,0,.7);
  }
  .artist-avatar span { font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; color: rgba(255,255,255,.92); letter-spacing: -.02em; }
  .artist-avatar::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 30% 20%, rgba(255,255,255,.22), transparent 55%); }
  .artist-card h4 { font-size: 14.5px; font-weight: 600; }
  .artist-card p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .artist-card .badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; }

  /* grid layouts */
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }
  .grid-artists { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }

  /* search chips */
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 999px;
    transition: color .2s, background .2s, border-color .2s, transform .2s var(--ease);
  }
  .chip:hover { color: var(--text); transform: translateY(-1px); }
  .chip.active { background: var(--accent); border-color: transparent; color: #04110a; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state svg { width: 46px; height: 46px; margin: 0 auto 14px; opacity: .5; }
  .empty-state h3 { font-family: var(--font-display); color: var(--text); font-size: 18px; margin-bottom: 6px; }

  /* playlist detail */
  .pl-hero {
    display: flex; align-items: flex-end; gap: 22px;
    padding: 26px; border-radius: 22px; margin-bottom: 26px;
    border: 1px solid var(--border);
    background: var(--banner-grad);
    position: relative; overflow: hidden;
  }
  .pl-hero .pl-big {
    width: 148px; height: 148px; border-radius: 16px; flex-shrink: 0;
    display: grid; place-items: center; box-shadow: 0 18px 44px -14px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .pl-hero .pl-big svg { width: 46%; height: 46%; color: rgba(255,255,255,.9); }
  .pl-hero .pl-type { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .pl-hero h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -.02em; margin: 6px 0 8px; }
  .pl-hero p { color: var(--muted); font-size: 13.5px; }
  .pl-play-big {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 9px;
    background: var(--accent); color: #04110a; border: 0;
    font-weight: 700; font-size: 14px; padding: 12px 26px; border-radius: 999px;
    box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--accent) 60%, transparent);
    transition: transform .25s var(--ease), box-shadow .25s;
  }
  .pl-play-big:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 16px 36px -8px color-mix(in srgb, var(--accent) 75%, transparent); }
  .pl-play-big svg { width: 17px; height: 17px; }

  .track-row {
    display: grid; grid-template-columns: 28px 1fr 90px 44px; gap: 14px; align-items: center;
    padding: 10px 12px; border-radius: 12px; cursor: pointer;
    transition: background .2s;
  }
  .track-row:hover { background: var(--bg-card); }
  .track-row.playing { background: var(--accent-soft); }
  .track-row .row-num { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; text-align: center; }
  .track-row.playing .row-num { color: var(--accent); }
  .track-row .row-art { width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0; }
  .track-row .row-main h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-row .row-main p { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-row.playing .row-main h4 { color: var(--accent); }
  .track-row .row-dur { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
  .track-row .row-like { background: none; border: 0; color: var(--muted); padding: 4px; border-radius: 8px; transition: color .2s; justify-self: end; }
  .track-row .row-like:hover { color: var(--text); }
  .track-row .row-like.liked { color: var(--accent); }

  /* ============ PLAYER BAR ============ */
  .player {
    grid-column: 2; grid-row: 2; z-index: 30;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
    padding: 12px 22px;
    background: rgba(10, 15, 11, .92);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }
  .player-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .pl-art {
    position: relative; width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; overflow: hidden;
    box-shadow: 0 8px 22px -8px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .pl-art svg { position: absolute; inset: 0; margin: auto; width: 40%; height: 40%; color: rgba(255,255,255,.5); }
  .pl-info { min-width: 0; }
  .pl-info h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-info p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-like { background: none; border: 0; color: var(--muted); padding: 6px; transition: color .2s, transform .2s; }
  .pl-like:hover { color: var(--text); transform: scale(1.12); }
  .pl-like.liked { color: var(--accent); }
  .pl-like svg { width: 17px; height: 17px; }

  .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 300px; max-width: 560px; width: 100%; }
  .pl-controls { display: flex; align-items: center; gap: 20px; }
  .pl-btn {
    background: none; border: 0; color: var(--muted); padding: 4px;
    transition: color .2s, transform .2s;
  }
  .pl-btn:hover { color: var(--text); transform: scale(1.12); }
  .pl-btn svg { width: 19px; height: 19px; }
  .pl-btn.shuffle.active, .pl-btn.repeat.active { color: var(--accent); }

          '<h4>' + esc(t.title) + '</h4>' +
          '<p>' + esc(t.artist) + '</p>' +
          '<div class="tc-row">' +
            '<span class="dur">' + fmt(t.dur) + '</span>' +
            '<span class="mini-eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function playlistCard(p) {
    return (
      '<button class="playlist-card" data-playlist="' + p.id + '" aria-label="Open playlist ' + esc(p.title) + '">' +
        '<div class="pl-cover" style="background:' + p.grad + '">' + PL_SVG + '</div>' +
        '<h4>' + esc(p.title) + '</h4>' +
        '<p>' + esc(p.desc) + ' · ' + p.tracks.length + ' songs</p>' +
      '</button>'
    );
  }

  function artistCard(a) {
    return (
      '<button class="artist-card" data-artist="' + esc(a.name) + '" aria-label="Play ' + esc(a.name) + '">' +
        '<div class="artist-avatar" style="background:' + a.color + '"><span>' + a.initials + '</span></div>' +
        '<h4>' + esc(a.name) + '</h4>' +
        '<p>' + a.listeners + ' monthly listeners</p>' +
        '<span class="badge">' + esc(a.genre) + '</span>' +
      '</button>'
    );
  }

  function trackRow(t, idx) {
    var isLiked = liked.has(t.id);
    var isCur = queue[current] === t.id;
    return (
      '<div class="track-row' + (isCur ? " playing" : "") + '" data-track="' + t.id + '" role="button" tabindex="0">' +
        '<span class="row-num">' + (isCur ? "♪" : idx + 1) + '</span>' +
        '<div class="row-main">' +
          '<h4>' + esc(t.title) + '</h4>' +
          '<p>' + esc(t.artist) + ' · ' + esc(t.album) + '</p>' +
        '</div>' +
        '<span class="row-dur">' + fmt(t.dur) + '</span>' +
        '<button class="row-like' + (isLiked ? " liked" : "") + '" data-like="' + t.id + '" aria-label="' + (isLiked ? "Remove from Library" : "Save to Library") + '">' +
          (isLiked ? HEART_FILLED : HEART_SVG) +
        '</button>' +
      '</div>'
    );
  }

  function section(title, inner, seeAll) {
    return (
      '<section class="section">' +
        '<div class="section-head"><h2>' + title + '</h2>' +
        (seeAll ? '<a class="see-all" href="#" data-seeall="' + seeAll + '">See all</a>' : "") +
        '</div>' + inner +
      '</section>'
    );
  }

  function hScroll(cards) {
    return '<div class="h-scroll">' + cards.join("") + '</div>';
  }

  /* ---------- views ---------- */
  function renderHome() {
    var recommended = TRACKS.slice(0, 8);
    var recently = recent.slice(0, 6).map(function (id) { return TRACKS[id]; });
    var playlists = PLAYLISTS.slice(0, 6);
    var artists = ARTISTS.slice(0, 7);

    var html =
      '<h1 class="view-title">Good evening, <span class="grad">Laker</span></h1>' +
      section("Recommended for you", hScroll(recommended.map(trackCard)), "search") +
      section("Recently played", hScroll(recently.map(trackCard))) +
      section("Popular playlists", hScroll(playlists.map(playlistCard)), "playlists") +
      section("Popular artists", hScroll(artists.map(artistCard)), "search") +
      section("Made for you", hScroll(PLAYLISTS.slice(0, 3).map(playlistCard)));
    $("#view").innerHTML = html;
  }

  function renderSearch() {
    var chips = GENRES.map(function (g) {
      return '<button class="chip' + (g === searchGenre ? " active" : "") + '" data-genre="' + esc(g) + '">' + esc(g) + "</button>";
    }).join("");

    var results = TRACKS.filter(function (t) {
      var term = searchTerm.toLowerCase();
      var matchTerm = !term || t.title.toLowerCase().indexOf(term) > -1 || t.artist.toLowerCase().indexOf(term) > -1 || t.album.toLowerCase().indexOf(term) > -1;
      var matchGenre = searchGenre === "All" || t.genre === searchGenre;
      return matchTerm && matchGenre;
    });

    var body = results.length
      ? '<div class="grid-4">' + results.map(trackCard).join("") + "</div>"
      : '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><h3>No results</h3><p>Try a different song, artist, or genre.</p></div>';

    $("#view").innerHTML =
      '<h1 class="view-title">Search</h1>' +
      '<div class="chips">' + chips + "</div>" + body;
  }

  function renderLibrary() {
    var likedTracks = TRACKS.filter(function (t) { return liked.has(t.id); });
    var recently = recent.slice(0, 8).map(function (id) { return TRACKS[id]; });

    var html =
      '<h1 class="view-title">Your <span class="grad">Library</span></h1>' +
      section("Liked songs", likedTracks.length
        ? '<div class="grid-4">' + likedTracks.map(trackCard).join("") + "</div>"
        : '<div class="empty-state"><h3>Nothing liked yet</h3><p>Tap the heart on any song to save it here.</p></div>') +
      section("Recently played", hScroll(recently.map(trackCard)));
    $("#view").innerHTML = html;
  }

  function renderPlaylists() {
    var html =
      '<h1 class="view-title">Playlists</h1>' +
      '<div class="grid-4">' + PLAYLISTS.map(playlistCard).join("") + "</div>" +
      '<div class="empty-state" style="padding:30px 20px 10px"><p style="color:var(--muted)">Curated for every mood — click one to dive in.</p></div>';
    $("#view").innerHTML = html;
  }

  function renderPlaylistDetail(id) {
    var p = PLAYLISTS.filter(function (x) { return x.id === id; })[0];
    if (!p) { renderPlaylists(); return; }
    activePlaylist = p;

    var rows = p.tracks.map(function (tid, i) {
      return trackRow(TRACKS[tid], i);
    }).join("");

    $("#view").innerHTML =
      '<div class="pl-hero">' +
        '<div class="pl-big" style="background:' + p.grad + '">' + PL_SVG + "</div>" +
        '<div>' +
          '<span class="pl-type">Playlist</span>' +
          "<h1>" + esc(p.title) + "</h1>" +
          '<p>' + esc(p.desc) + " · " + p.tracks.length + " songs · " + fmt(p.tracks.reduce(function (s, tid) { return s + TRACKS[tid].dur; }, 0)) + "</p>" +
          '<button class="pl-play-big" data-playall="' + p.id + '">' + PLAY_ICON + " Play all</button>" +
        "</div>" +
      "</div>" +
      '<div data-queue="' + p.tracks.join(",") + '">' + rows + "</div>";
  }

  /* ================= ROUTING ================= */
  function setView(name, param) {
    view = name;
    activePlaylist = null;
    $$(".nav-item").forEach(function (b) {
      b.classList.toggle("active", b.dataset.nav === name);
    });
    $("#searchInput").value = searchTerm;

    if (name === "home") renderHome();
    else if (name === "search") renderSearch();
    else if (name === "library") renderLibrary();
    else if (name === "playlists") renderPlaylists();
    else if (name === "playlist") renderPlaylistDetail(param);

    renderPlaylistNav();
    closeSidebar();
  }

  function renderPlaylistNav() {
    var nav = $("#playlistNav");
    nav.innerHTML = PLAYLISTS.map(function (p) {
      return (
        "<li>" +
          '<button data-playlist="' + p.id + '" class="' + (activePlaylist && activePlaylist.id === p.id ? "active" : "") + '">' +
            '<span class="pl-dot" style="background:' + p.grad + '">' + PL_SVG + "</span>" +
            '<span class="pl-name">' + esc(p.title) + "</span>" +
          "</button>" +
        "</li>"
      );
    }).join("");
  }

  /* ================= PLAYER LOGIC ================= */
  function trackById(id) { return TRACKS.filter(function (t) { return t.id === id; })[0]; }

  function setQueue(ids, startId) {
    queue = ids.slice();
    current = queue.indexOf(startId);
    if (current === -1) current = 0;
  }

  function loadTrack() {
    var t = trackById(queue[current]);
    if (!t) return;
    progress = 0;
    $("#plArt").style.background = t.grad;
    $("#plTitle").textContent = t.title;
    $("#plArtist").textContent = t.artist + " · " + t.album;
    $("#totalTime").textContent = fmt(t.dur);
    $("#seek").setAttribute("aria-valuemax", String(t.dur));
    updateLikeBtn();
    syncProgress();
    updatePlayingIndicators();
    pushRecent(t.id);
  }

  function play() {
    if (!queue.length) return;
    playing = true;
    $("#playBtn").innerHTML = PAUSE_ICON;
    $("#playBtn").setAttribute("aria-label", "Pause");
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 1000);
    updatePlayingIndicators();
  }

  function pause() {
    playing = false;
    $("#playBtn").innerHTML = PLAY_ICON;
    $("#playBtn").setAttribute("aria-label", "Play");
    if (timer) clearInterval(timer);
    timer = null;
    updatePlayingIndicators();
  }

  function togglePlay() { playing ? pause() : play(); }

  function tick() {
    var t = trackById(queue[current]);
    if (!t) return;
    progress += 1;
    if (progress >= t.dur) {
      if (repeat === "one") { progress = 0; }
      else nextTrack();
    }
    syncProgress();
  }

  function nextTrack() {
    if (!queue.length) return;
    if (shuffle && queue.length > 1) {
      var i = current;
      while (i === current) i = Math.floor(Math.random() * queue.length);
      current = i;
    } else {
      current = (current + 1) % queue.length;
      if (current === 0 && repeat !== "all") { pause(); }
    }
    loadTrack();
    if (playing) { /* keep playing */ }
  }

  function prevTrack() {
    if (!queue.length) return;
    var t = trackById(queue[current]);
    if (progress > 3) { progress = 0; syncProgress(); return; }
    current = (current - 1 + queue.length) % queue.length;
    loadTrack();
  }

  function playTrackFrom(ids, id) {
    setQueue(ids, id);
    loadTrack();
    play();
  }

  function pushRecent(id) {
    recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, 8);
    saveState();
  }

  function updateLikeBtn() {
    var t = trackById(queue[current]);
    var isLiked = t && liked.has(t.id);
    $("#plLike").innerHTML = isLiked ? HEART_FILLED : HEART_SVG;
    $("#plLike").classList.toggle("liked", !!isLiked);
    $("#plLike").setAttribute("aria-label", isLiked ? "Remove from Library" : "Save to Library");
  }

  function syncProgress() {
    var t = trackById(queue[current]);
    var dur = t ? t.dur : 0;
    var pct = dur ? Math.min(100, (progress / dur) * 100) : 0;
    $("#seekFill").style.width = pct + "%";
    $("#seekThumb").style.left = pct + "%";
    $("#curTime").textContent = fmt(progress);
    $("#seek").setAttribute("aria-valuenow", String(Math.round(pct)));
  }

  function updatePlayingIndicators() {
    // highlight the card / row for the current track across all views
    $$(".track-card").forEach(function (el) {
      var isCur = Number(el.dataset.track) === queue[current] && playing;
      el.classList.toggle("playing", isCur);
    });
    $$(".track-row").forEach(function (el) {
      el.classList.toggle("playing", Number(el.dataset.track) === queue[current]);
    });
  }

  function toggleLike(id) {
    if (liked.has(id)) liked.delete(id);
    else liked.add(id);
    saveState();
    updateLikeBtn();
    // re-render hearts in the current view without losing scroll position
    var t = trackById(id);
    $$('[data-like="' + id + '"]').forEach(function (btn) {
      var isLiked = liked.has(id);
      btn.classList.toggle("liked", isLiked);
      btn.innerHTML = isLiked ? HEART_FILLED : HEART_SVG;
      btn.setAttribute("aria-label", isLiked ? "Remove from Library" : "Save to Library");
    });
  }

  function seekTo(pct) {
    var t = trackById(queue[current]);
    progress = t ? Math.round((pct / 100) * t.dur) : 0;
    syncProgress();
  }

  function toggleShuffle() {
    shuffle = !shuffle;
    $("#shuffleBtn").classList.toggle("active", shuffle);
    saveState();
  }

  function toggleRepeat() {
    repeat = repeat === "off" ? "all" : repeat === "all" ? "one" : "off";
    var btn = $("#repeatBtn");
    btn.classList.toggle("active", repeat !== "off");
    btn.classList.toggle("repeat-one", repeat === "one");
    btn.setAttribute("aria-label", "Repeat: " + (repeat === "one" ? "one" : repeat));
  }

  function applyVolume(v) {
    volume = v;
    saveState();
    var el = $("#volInput");
    el.value = v;
    el.style.background = "linear-gradient(to right, var(--accent) " + v + "%, rgba(255,255,255,.14) " + v + "%)";
  }

  /* ================= EVENTS ================= */
  // view-level click delegation
  $("#view").addEventListener("click", function (e) {
    var likeBtn = e.target.closest("[data-like]");
    if (likeBtn) { e.stopPropagation(); toggleLike(Number(likeBtn.dataset.like)); return; }

    var genreBtn = e.target.closest("[data-genre]");
    if (genreBtn) { searchGenre = genreBtn.dataset.genre; renderSearch(); return; }

    var playlistBtn = e.target.closest("[data-playlist]");
    if (playlistBtn) { setView("playlist", playlistBtn.dataset.playlist); return; }

    var playAll = e.target.closest("[data-playall]");
    if (playAll) {
      var p = PLAYLISTS.filter(function (x) { return x.id === playAll.dataset.playall; })[0];
      if (p) playTrackFrom(p.tracks, p.tracks[0]);
      return;
    }

    var artistBtn = e.target.closest("[data-artist]");
    if (artistBtn) {
      var name = artistBtn.dataset.artist;
      var ids = TRACKS.filter(function (t) { return t.artist === name; }).map(function (t) { return t.id; });
      if (ids.length) playTrackFrom(ids, ids[0]);
      return;
    }

    var seeAll = e.target.closest("[data-seeall]");
    if (seeAll) { e.preventDefault(); setView(seeAll.dataset.seeall); return; }

    var trackEl = e.target.closest("[data-track]");
    if (trackEl) {
      var q = e.target.closest("[data-queue]");
      var ids = q ? q.dataset.queue.split(",").map(Number) : TRACKS.map(function (t) { return t.id; });
      playTrackFrom(ids, Number(trackEl.dataset.track));
    }
  });

  // keyboard activation for card/row buttons
  $("#view").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest("[data-track]")) {
      e.preventDefault();
      var trackEl = e.target.closest("[data-track]");
      var q = e.target.closest("[data-queue]");
      var ids = q ? q.dataset.queue.split(",").map(Number) : TRACKS.map(function (t) { return t.id; });
      playTrackFrom(ids, Number(trackEl.dataset.track));
    }
  });

  // sidebar nav + playlist nav
  $$(".nav-item").forEach(function (btn) {
    btn.addEventListener("click", function () { setView(btn.dataset.nav); });
  });
  $("#playlistNav").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-playlist]");
    if (btn) setView("playlist", btn.dataset.playlist);
  });
  $("#themeRow").addEventListener("click", function (e) {
    var sw = e.target.closest("[data-theme]");
    if (sw) applyTheme(sw.dataset.theme);
  });
  $("#newPlaylistBtn").addEventListener("click", function () {
    setView("playlists");
    var el = $("#view").querySelector(".empty-state");
    if (el) el.innerHTML = "<p style='color:var(--accent)'>New playlist coming soon — curate your own mixes in the full beta.</p>";
  });

  // search
  var searchDebounce = null;
  $("#searchInput").addEventListener("input", function (e) {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      searchTerm = e.target.value.trim();
      setView("search");
    }, 160);
  });

  // player buttons
  $("#playBtn").addEventListener("click", togglePlay);
  $("#nextBtn").addEventListener("click", function () { nextTrack(); if (!playing) play(); });
  $("#prevBtn").addEventListener("click", prevTrack);
  $("#shuffleBtn").addEventListener("click", toggleShuffle);
  $("#repeatBtn").addEventListener("click", toggleRepeat);
  $("#plLike").addEventListener("click", function () {
    var t = trackById(queue[current]);
    if (t) toggleLike(t.id);
  });

  // seek bar (click + drag)
  var seek = $("#seek");
  var dragging = false;
  function seekFromEvent(e) {
    var r = seek.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100;
    seekTo(pct);
    return pct;
  }
  seek.addEventListener("pointerdown", function (e) {
    dragging = true;
    seek.classList.add("dragging");
    seek.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  seek.addEventListener("pointermove", function (e) { if (dragging) seekFromEvent(e); });
  seek.addEventListener("pointerup", function (e) {
    dragging = false;
    seek.classList.remove("dragging");
  });
  seek.addEventListener("keydown", function (e) {
    var step = 5;
    if (e.key === "ArrowRight") { seekTo(Math.min(100, parseFloat(seekFillWidth()) + step)); }
    if (e.key === "ArrowLeft") { seekTo(Math.max(0, parseFloat(seekFillWidth()) - step)); }
  });
  function seekFillWidth() {
    var t = trackById(queue[current]);
    return t ? (progress / t.dur) * 100 : 0;
  }

  // volume
  $("#volInput").addEventListener("input", function (e) { applyVolume(Number(e.target.value)); });

  // mobile sidebar
  $("#hamburger").addEventListener("click", function () {
    $("#sidebar").classList.toggle("open");
    $("#scrim").classList.toggle("show");
  });
  $("#scrim").addEventListener("click", closeSidebar);
  function closeSidebar() {
    $("#sidebar").classList.remove("open");
    $("#scrim").classList.remove("show");
  }

  // global spacebar
  document.addEventListener("keydown", function (e) {
    var tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  });

  /* ================= BOOT ================= */
  loadState();
  try {
    var savedTheme = localStorage.getItem("onebeat_app_theme");
    if (savedTheme && THEMES.some(function (t) { return t.id === savedTheme; })) currentTheme = savedTheme;
  } catch (e) {}
  applyTheme(currentTheme);
  applyVolume(volume);
  $("#shuffleBtn").classList.toggle("active", shuffle);
  renderPlaylistNav();
  loadTrack();
  setView("home");
})();
</script>
</body>
</html>
