<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OneBEAT — Artist Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307070b'/%3E%3Cpath d='M12 9.5v13M12 13l11-3.5v13' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070b;--bg-soft:#0c0c13;--surface:rgba(255,255,255,.04);--surface-strong:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09);--text:#f4f4f8;--muted:#9d9dab;
  --brand:#a855f7;--brand-2:#ec4899;--brand-3:#f97316;
  --grad:linear-gradient(120deg,#a855f7,#ec4899 55%,#f97316);
  --grad-soft:linear-gradient(120deg,rgba(168,85,247,.16),rgba(236,72,153,.16));
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;
  --radius:14px;--radius-sm:10px;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sidebar-w:250px;
}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
img,svg{display:block}a{color:inherit;text-decoration:none}
::selection{background:rgba(168,85,247,.4);color:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}

.sidebar{grid-row:1/3;display:flex;flex-direction:column;background:var(--bg-soft);border-right:1px solid var(--border);padding:16px 10px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:12px}
.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grad);box-shadow:0 6px 20px -6px rgba(236,72,153,.55)}
.brand-mark svg{width:16px;height:16px;color:#fff}
.brand small{display:block;font-size:8px;letter-spacing:.3em;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-top:-3px}
.side-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);font-size:13.5px;font-weight:600;border:0;background:none;text-align:left;width:100%;position:relative;transition:all .2s var(--ease)}
.nav-item:hover{color:var(--text);background:var(--surface-strong)}
.nav-item.active{color:#fff;background:rgba(168,85,247,.18)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--brand-2);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 10px 6px}
.sidebar-footer .artist-info{display:flex;align-items:center;gap:10px}
.artist-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.artist-name{font-size:13px;font-weight:600}.artist-role{font-size:11px;color:var(--muted)}

.main{grid-row:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:linear-gradient(to bottom,var(--bg) 70%,transparent);backdrop-filter:blur(12px)}
.topbar h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hamburger{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;color:var(--text)}
.hamburger svg{width:18px;height:18px}
.notif-btn{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;color:var(--muted);transition:all .2s}
.notif-btn:hover{color:var(--text)}.notif-btn svg{width:18px;height:18px}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brand-2);border:2px solid var(--bg)}

.content{padding:8px 28px 40px;flex:1}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .3s var(--ease)}
.stat-card:hover{border-color:rgba(255,255,255,.16);transform:translateY(-2px)}
.stat-card h3{font-size:26px;font-weight:700;font-family:var(--font-display);letter-spacing:-.03em}
.stat-card p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat-card .trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:99px}
.trend.up{color:var(--green);background:rgba(52,211,153,.1)}
.trend.down{color:var(--red);background:rgba(248,113,113,.1)}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.chart-card.full{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chart-head h3{font-size:15px;font-weight:700}
.chart-area{position:relative;height:200px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100%;padding-bottom:24px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;background:var(--grad);min-height:4px;transition:height .5s var(--ease);cursor:pointer;position:relative}
.chart-bar:hover{opacity:.85}
.chart-bar::after{content:attr(data-val);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s}
.chart-bar:hover::after{opacity:1}
.chart-labels{display:flex;justify-content:space-between;position:absolute;bottom:0;left:0;right:0;font-size:10px;color:var(--muted)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px;flex-wrap:wrap}
.table-head h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.table-scroll{overflow-x:auto}
.table-avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;vertical-align:middle;margin-right:10px}
.table-artist-cell{display:flex;align-items:center}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge-green{color:var(--green);background:rgba(52,211,153,.12)}
.badge-yellow{color:var(--yellow);background:rgba(251,191,36,.12)}
.badge-red{color:var(--red);background:rgba(248,113,113,.12)}
.badge-blue{color:var(--blue);background:rgba(96,165,250,.12)}
.badge-purple{color:var(--brand);background:rgba(168,85,247,.12)}
.badge-gray{color:var(--muted);background:rgba(255,255,255,.06)}

.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px -6px rgba(236,72,153,.5)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(236,72,153,.65)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-strong);border-color:rgba(255,255,255,.18)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.25)}
.action-btns{display:flex;gap:6px}
.action-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--muted);transition:all .2s}
.action-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:var(--surface-strong)}
.action-btn svg{width:14px;height:14px}

/* Upload stepper */
.upload-stepper{display:flex;align-items:center;gap:0;margin-bottom:32px;position:relative}
.upload-step{display:flex;align-items:center;gap:10px;flex:1;position:relative}
.upload-step .step-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--border);color:var(--muted);flex-shrink:0;transition:all .3s}
.upload-step.active .step-num{border-color:var(--brand);background:rgba(168,85,247,.15);color:var(--brand)}
.upload-step.done .step-num{border-color:var(--green);background:rgba(52,211,153,.15);color:var(--green)}
.upload-step .step-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.upload-step.active .step-label{color:var(--text)}
.upload-step.done .step-label{color:var(--green)}
.upload-step::after{content:"";position:absolute;left:calc(100% + 0px);top:50%;width:100%;height:2px;background:var(--border);z-index:-1}
.upload-step:last-child::after{display:none}
.upload-step.done::after{background:var(--green)}

.upload-form{max-width:640px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(168,85,247,.5)}
.form-group select option{background:var(--bg)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.upload-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:48px;text-align:center;cursor:pointer;transition:all .3s}
.upload-drop:hover{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.04)}
.upload-drop svg{width:48px;height:48px;color:var(--muted);margin:0 auto 14px}
.upload-drop h3{font-size:16px;margin-bottom:6px}
.upload-drop p{color:var(--muted);font-size:13px}
.upload-drop .uploaded{display:none;padding:14px;background:rgba(52,211,153,.1);border-radius:10px;border:1px solid rgba(52,211,153,.3)}
.upload-drop.has-file .uploaded{display:block}
.upload-drop.has-file h3,.upload-drop.has-file>p,.upload-drop.has-file>svg{display:none}

.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-top:20px}
.preview-card h4{margin-bottom:12px}
.preview-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.preview-row:last-child{border-bottom:none}
.preview-row span:first-child{color:var(--muted)}

/* Profile section */
.profile-hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:24px}
.profile-cover{height:200px;position:relative}
.profile-cover .cover-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.profile-cover .cover-art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 10%,transparent 60%)}
.profile-details{position:relative;padding:0 28px 28px;margin-top:-50px;display:flex;align-items:flex-end;gap:20px}
.profile-avatar{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;flex-shrink:0;border:4px solid var(--bg);position:relative;z-index:1;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.profile-info h2{font-family:var(--font-display);font-size:24px;font-weight:700}
.profile-info p{color:var(--muted);font-size:13px;margin-top:2px}
.profile-stats{display:flex;gap:24px;margin-top:10px}
.profile-stats .ps{text-align:center}
.profile-stats .ps strong{display:block;font-size:16px;font-weight:700}
.profile-stats .ps span{font-size:11px;color:var(--muted)}

/* Settings section */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13.5px;font-weight:500}
.setting-desc{font-size:12px;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:44px;height:24px;border-radius:99px;background:var(--surface-strong);border:1px solid var(--border);cursor:pointer;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--brand);border-color:var(--brand)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 14px;opacity:.4}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;padding:8px 18px;border-radius:99px;transition:all .2s var(--ease)}
.chip:hover{color:var(--text);transform:translateY(-1px)}
.chip.active{background:var(--brand);border-color:transparent;color:#fff}

.toast{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;align-items:center;gap:10px;background:rgba(20,20,32,.95);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;font-size:13px;font-weight:500;box-shadow:0 20px 60px -12px rgba(0,0,0,.8);backdrop-filter:blur(16px);transform:translateY(80px);opacity:0;transition:all .4s var(--ease);max-width:380px}
.toast.show{transform:none;opacity:1}
.toast svg{width:18px;height:18px;flex-shrink:0}

.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(7,7,11,.75);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:min(600px,95%);max-height:90vh;background:linear-gradient(180deg,rgba(20,20,32,.98),rgba(12,12,20,.99));border:1px solid var(--border);border-radius:20px;padding:28px;overflow-y:auto;transform:translateY(20px);transition:transform .3s var(--ease)}
.modal-backdrop.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h2{font-family:var(--font-display);font-size:20px;font-weight:700}
.modal-close{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;color:var(--muted);transition:all .2s}
.modal-close:hover{color:var(--text)}
.modal-close svg{width:16px;height:16px}

@media(max-width:1024px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;width:var(--sidebar-w);transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:20px 0 60px -20px rgba(0,0,0,.7)}.sidebar.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.show{opacity:1;pointer-events:auto}.hamburger{display:flex!important}.chart-grid{grid-template-columns:1fr}}
@media(max-width:768px){.content{padding:8px 14px 40px}.topbar{padding:10px 14px}.form-row{grid-template-columns:1fr}.profile-details{flex-direction:column;align-items:flex-start}.upload-step .step-label{display:none}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .4s var(--ease) both}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9.5v13M12 13l11-3.5v13"/></svg></span>
      <span>OneBEAT<small>ARTIST</small></span>
    </a>
    <div class="side-label">Main</div>
    <button class="nav-item active" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview</button>
    <button class="nav-item" data-page="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</button>
    <div class="side-label">Music</div>
    <button class="nav-item" data-page="songs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>My Songs<span class="nav-badge">12</span></button>
    <button class="nav-item" data-page="albums"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>Albums</button>
    <button class="nav-item" data-page="eps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>EPs</button>
    <button class="nav-item" data-page="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Music</button>
    <button class="nav-item" data-page="releases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Release Manager</button>

      '<div class="form-row"><div class="form-group"><label>Release Date</label><input type="date" id="upDate" value="'+esc(uploadState.releaseDate)+'"/></div><div class="form-group"><label>Copyright</label><input id="upCopyright" value="'+esc(uploadState.copyright)+'" placeholder="© 2025 Artist Name"/></div></div>'+
      '<div class="form-row"><div class="form-group"><label>Composer</label><input id="upComposer" value="'+esc(uploadState.composer)+'" placeholder="Composer name"/></div><div class="form-group"><label>Producer</label><input id="upProducer" value="'+esc(uploadState.producer)+'" placeholder="Producer name"/></div></div>'+

    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn btn-ghost" id="uploadPrev">← Back</button><button class="btn btn-primary" id="uploadNext">Continue →</button></div>';

      '<div class="preview-row"><span>Title</span><strong>'+esc(uploadState.title||"Untitled")+'</strong></div>'+

      '<div class="preview-row"><span>Genre</span><span>'+esc(uploadState.genre)+'</span></div>'+
      '<div class="preview-row"><span>Language</span><span>'+esc(uploadState.language)+'</span></div>'+
      '<div class="preview-row"><span>Release Date</span><span>'+esc(uploadState.releaseDate||"Upon approval")+'</span></div>'+
      '<div class="preview-row"><span>Copyright</span><span>'+esc(uploadState.copyright||"© 2025 Kira Solace")+'</span></div>'+
      '<div class="preview-row"><span>Composer</span><span>'+esc(uploadState.composer||"—")+'</span></div>'+
      '<div class="preview-row"><span>Producer</span><span>'+esc(uploadState.producer||"—")+'</span></div>'+
      '<div class="preview-row"><span>Audio</span><span style="color:var(--green)">✓ '+esc(uploadState.fileName||"audio_file.mp3")+'</span></div>'+

pages.analytics=function(){
  var published=mySongs.filter(function(s){return s.status==="published"});
  var totalStreams=published.reduce(function(a,s){return a+s.streams},0);
  var totalLikes=published.reduce(function(a,s){return a+s.likes},0);
  var dailyStreams=[1.2,1.3,1.1,1.4,1.5,1.4,1.6,1.7,1.6,1.8,1.7,1.9,2.0,1.9,2.1,2.0,2.2,2.1,2.3,2.2,2.4,2.3,2.5,2.4,2.5,2.6,2.5,2.7,2.6,2.8];
  var maxD=Math.max.apply(null,dailyStreams);
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var listenerGrowth=[12.4,14.2,16.1,18.4,20.8,22.6,25.1,27.8,30.2,32.1,33.6,34.8];
  var maxL=Math.max.apply(null,listenerGrowth);

  return '<div class="chart-grid">'+
    '<div class="chart-card full"><div class="chart-head"><h3>Daily Streams (Millions)</h3></div><div class="chart-area"><div class="chart-bars">'+dailyStreams.map(function(v,i){return '<div class="chart-bar" style="height:'+(v/maxD*100)+'%;opacity:'+(0.5+i/dailyStreams.length*0.5)+'" data-val="'+v+'M"></div>'}).join("")+'</div><div class="chart-labels"><span>1</span><span>7</span><span>14</span><span>21</span><span>30</span></div></div></div>'+
    '<div class="chart-card"><div class="chart-head"><h3>Monthly Listeners Growth</h3></div><div class="chart-area"><div class="chart-bars">'+listenerGrowth.map(function(v,i){return '<div class="chart-bar" style="height:'+(v/maxL*100)+'%;background:linear-gradient(180deg,#ec4899,#a855f7)" data-val="'+v+'M"></div>'}).join("")+'</div><div class="chart-labels">'+months.map(function(m){return '<span>'+m+'</span>'}).join("")+'</div></div></div>'+
    '<div class="chart-card"><div class="chart-head"><h3>Top Songs</h3></div><div style="display:grid;gap:8px">'+published.sort(function(a,b){return b.streams-a.streams}).slice(0,5).map(function(s,i){
      var pct=Math.round((s.streams/published[0].streams)*100);
      return '<div><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12.5px;font-weight:600">'+(i+1)+'. '+esc(s.title)+'</span><span style="font-size:11px;color:var(--muted)">'+fmt(s.streams)+'</span></div><div style="height:4px;border-radius:4px;background:var(--surface-strong);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--grad);border-radius:4px"></div></div></div>';
    }).join("")+'</div></div>'+
    '<div class="chart-card full"><div class="chart-head"><h3>Key Metrics</h3></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px">'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">'+fmt(totalStreams)+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Total Streams</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">'+fmt(totalLikes)+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Total Likes</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">'+fmt(artistProfile.followers)+'</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Followers</div></div>'+
      '<div style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:700;font-family:var(--font-display)">3.8min</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Avg Listen Time</div></div>'+
    '</div></div></div>';
};

    '</div></div></div>';
};

pages.comments=function(){
  return '<div style="display:grid;gap:8px">'+myComments.map(function(c){

  }).join("")+'</div>';
};

pages.notifications=function(){
  return '<div style="display:grid;gap:8px">'+myNotifications.map(function(n){
    var colors={info:"var(--blue)",warning:"var(--yellow)",success:"var(--green)"};
    return '<div style="padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:'+(n.read?"var(--surface)":"rgba(168,85,247,.06)")+'"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="width:8px;height:8px;border-radius:50%;background:'+(colors[n.type]||"var(--muted)")+'"></div><strong style="font-size:13px">'+esc(n.title)+'</strong><span style="margin-left:auto;font-size:11px;color:var(--muted)">'+esc(n.time)+'</span></div><p style="font-size:12.5px;color:var(--muted);line-height:1.5">'+esc(n.message)+'</p></div>';
  }).join("")+'</div>';

pages.earnings=function(){
  var published=mySongs.filter(function(s){return s.status==="published"});
  var totalEarnings=published.reduce(function(a,s){return a+Math.round(s.streams*0.004)},0);
  var earningsBySong=published.map(function(s){return{title:s.title,streams:s.streams,earnings:Math.round(s.streams*0.004)}}).sort(function(a,b){return b.earnings-a.earnings});

  return '<div class="stat-grid"><div class="stat-card"><h3>$'+(totalEarnings/100).toFixed(0)+'</h3><p>Total Estimated Earnings</p></div><div class="stat-card"><h3>$'+((totalEarnings*0.15)/100).toFixed(0)+'</h3><p>Pending Payout</p></div><div class="stat-card"><h3>$'+((totalEarnings*0.85)/100).toFixed(0)+'</h3><p>Paid Out</p></div></div>'+
  '<div class="table-wrap"><div class="table-head"><h3>Earnings by Song</h3><span class="badge badge-gray">Payments on hold</span></div><div class="table-scroll"><table><thead><tr><th>Song</th><th>Streams</th><th>Est. Earnings</th></tr></thead><tbody>'+earningsBySong.map(function(e){return '<tr><td><strong>'+esc(e.title)+'</strong></td><td>'+fmt(e.streams)+'</td><td><strong>$'+fmt(e.earnings)+'</strong></td></tr>'}).join("")+'</tbody></table></div></div>';
};

  '</div>';

function saveUploadInputs(){
  var fields=[
    ["upTitle","title"],["upFeatured","featured"],["upAlbum","album"],
    ["upCopyright","copyright"],["upComposer","composer"],["upProducer","producer"],
    ["upDesc","description"]
  ];
  fields.forEach(function(pair){
    var el=$("#"+pair[0]);
    if(el)uploadState[pair[1]]=el.value;
  });
  var genreEl=$("#upGenre");if(genreEl)uploadState.genre=genreEl.value;
  var langEl=$("#upLang");if(langEl)uploadState.language=langEl.value;
  var dateEl=$("#upDate");if(dateEl)uploadState.releaseDate=dateEl.value;
}

/* ===== EVENT BINDING ===== */
function bindEvents(){
  $$("[data-nav]").forEach(function(b){b.addEventListener("click",function(){setPage(b.dataset.nav)})});
  var editBtn=$("#editProfileBtn");
  if(editBtn)editBtn.addEventListener("click",function(){showToast("Profile edit mode — save your changes")});

  // Upload steps
  var upNext=$("#uploadNext");
  var upPrev=$("#uploadPrev");
  if(upNext)upNext.addEventListener("click",function(){
    saveUploadInputs();
    if(uploadState.step<5){uploadState.step++;renderPage();window.scrollTo(0,0)}
  });
  if(upPrev)upPrev.addEventListener("click",function(){
    saveUploadInputs();
    if(uploadState.step>1){uploadState.step--;renderPage();window.scrollTo(0,0)}
  });

  var submitBtn=$("#submitRelease");
  if(submitBtn)submitBtn.addEventListener("click",function(){
    saveUploadInputs();
    mySongs.push({id:"s_"+Date.now(),title:uploadState.title||"Untitled",album:uploadState.album||"",genre:uploadState.genre,duration:200,status:"pending_review",streams:0,likes:0,downloads:0,date:new Date().toISOString().slice(0,10),featured:uploadState.featured||""});
    uploadState={step:1,fileName:"",fileSize:"",title:"",featured:"",album:"",genre:"Pop",language:"English",releaseDate:"",copyright:"",composer:"",producer:"",description:"",artworkName:""};
    showToast("Release submitted for review!");
    setPage("releases");
  });

  var dropZone=$("#audioDropZone");
  if(dropZone)dropZone.addEventListener("click",function(){
    uploadState.fileName="neon_dreams_v2.mp3";
    uploadState.fileSize="4.2 MB";
    dropZone.classList.add("has-file");
  });
  var artDrop=$("#artDropZone");
  if(artDrop)artDrop.addEventListener("click",function(){
    uploadState.artworkName="electric_sky_cover.jpg";
    artDrop.classList.add("has-file");
  });

  // Toggles
  $$(".toggle").forEach(function(t){t.addEventListener("click",function(){t.classList.toggle("on")})});
}

/* ===== SIDEBAR ===== */
$$(".nav-item").forEach(function(btn){btn.addEventListener("click",function(){setPage(btn.dataset.page)})});
$("#hamburger").addEventListener("click",function(){$("#sidebar").classList.toggle("open");$("#scrim").classList.toggle("show")});
$("#scrim").addEventListener("click",function(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")});
function closeSidebar(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")}

/* ===== BOOT ===== */
renderPage();
})();
</script>
