<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OneBEAT — Register as an Artist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307070b'/%3E%3Cpath d='M12 9.5v13M12 13l11-3.5v13' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070b;--bg-soft:#0c0c13;--surface:rgba(255,255,255,.04);--surface-strong:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09);--text:#f4f4f8;--muted:#9d9dab;
  --brand:#a855f7;--brand-2:#ec4899;--brand-3:#f97316;
  --grad:linear-gradient(120deg,#a855f7,#ec4899 55%,#f97316);
  --grad-soft:linear-gradient(120deg,rgba(168,85,247,.16),rgba(236,72,153,.16));
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;
  --radius:14px;--radius-sm:10px;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html,body{min-height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(168,85,247,.4);color:#fff}

/* ===== LAYOUT ===== */
.page{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px}
.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grad)}
.brand-mark svg{width:16px;height:16px;color:#fff}
.brand small{display:block;font-size:8px;letter-spacing:.3em;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-top:-3px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-right a{font-size:13.5px;font-weight:500;color:var(--muted);transition:color .2s}
.topbar-right a:hover{color:var(--text)}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);transition:color .2s;background:none;border:0}
.btn-back:hover{color:var(--text)}
.btn-back svg{width:16px;height:16px}

.hero-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(50% 40% at 50% 0%,rgba(168,85,247,.1),transparent 60%),var(--bg)}

.form-container{flex:1;display:flex;justify-content:center;padding:clamp(24px,5vw,60px) 5% clamp(40px,5vw,80px)}
.form-card{width:min(720px,100%)}
.form-card h1{font-family:var(--font-display);font-size:clamp(28px,4vw,38px);font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.form-card .subtitle{color:var(--muted);font-size:16px;margin-bottom:32px}

/* Stepper */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:36px;position:relative}
.step{display:flex;align-items:center;gap:8px;flex:1;position:relative}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--border);color:var(--muted);flex-shrink:0;transition:all .3s}
.step.active .num{border-color:var(--brand);background:rgba(168,85,247,.15);color:var(--brand)}
.step.done .num{border-color:var(--green);background:rgba(52,211,153,.15);color:var(--green)}
.step .label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.step.active .label{color:var(--text)}
.step.done .label{color:var(--green)}
.step::after{content:"";position:absolute;left:calc(100% + 0px);top:50%;width:100%;height:2px;background:var(--border);z-index:-1}
.step:last-child::after{display:none}
.step.done::after{background:var(--green)}

/* Form */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.section-card h3{font-size:16px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.section-card h3 svg{width:20px;height:20px;color:var(--brand)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.form-group label .required{color:var(--red)}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface-strong);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(168,85,247,.5);box-shadow:0 0 0 3px rgba(168,85,247,.1)}
.form-group textarea{resize:vertical;min-height:90px}
.form-group select option{background:var(--bg)}
.form-group .hint{font-size:11px;color:var(--muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* File drops */
.file-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .3s}
.file-drop:hover{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.04)}
.file-drop svg{width:36px;height:36px;color:var(--muted);margin:0 auto 10px}
.file-drop h4{font-size:14px;margin-bottom:4px}
.file-drop p{color:var(--muted);font-size:12px}
.file-drop.has-file{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}
.file-drop.has-file .file-info{display:block}
.file-drop.has-file .file-placeholder{display:none}
.file-info{display:none;font-size:13px;color:var(--green);font-weight:600}

/* Checkbox */
.checkbox-wrap{display:flex;align-items:flex-start;gap:10px;padding:12px 0}
.checkbox-wrap input[type="checkbox"]{width:18px;height:18px;accent-color:var(--brand);flex-shrink:0;margin-top:2px}
.checkbox-wrap label{font-size:13px;color:var(--muted);line-height:1.5}
.checkbox-wrap label a{color:var(--brand);text-decoration:underline}

/* Actions */
.form-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:12px 24px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 28px -8px rgba(236,72,153,.5)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px -8px rgba(236,72,153,.65)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-strong);border-color:rgba(255,255,255,.18)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Success */
.success-view{text-align:center;padding:60px 20px;max-width:520px;margin:0 auto}
.success-icon{width:80px;height:80px;border-radius:50%;background:rgba(52,211,153,.12);border:2px solid rgba(52,211,153,.3);display:grid;place-items:center;margin:0 auto 24px}
.success-icon svg{width:36px;height:36px;color:var(--green)}
.success-view h1{font-family:var(--font-display);font-size:28px;margin-bottom:12px}
.success-view p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:8px}
.success-view .timeline{margin:32px 0;text-align:left}
.timeline-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:5px}
.timeline-item.current .timeline-dot{background:var(--brand);box-shadow:0 0 12px rgba(168,85,247,.5)}
.timeline-item .tl-text{font-size:13px}.timeline-item .tl-text strong{display:block;margin-bottom:2px}.timeline-item .tl-text span{color:var(--muted);font-size:12px}

.footer-note{text-align:center;padding:20px;font-size:12px;color:rgba(255,255,255,.3);border-top:1px solid var(--border);margin-top:auto}

@media(max-width:640px){.form-row,.form-row-3{grid-template-columns:1fr}.stepper{flex-wrap:wrap}.step .label{display:none}.topbar{padding:14px 4%}}
</style>
</head>
<body>
<div class="page">
  <div class="hero-bg"></div>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9.5v13M12 13l11-3.5v13"/></svg></span>
      <span>OneBEAT<small>MUSIC</small></span>
    </a>
    <div class="topbar-right">
      <a href="app.html">Public Platform</a>
      <a href="admin.html" style="color:var(--brand)">Admin</a>
      <a href="artist.html" style="color:var(--green)">Artist Portal</a>
    </div>
  </header>

  <div class="form-container">
    <div class="form-card" id="formCard">
      <!-- Rendered by JS -->
    </div>
  </div>

  <div class="footer-note">© 2025 OneBEAT Music · Artist Registration</div>
</div>

<script>
(function(){
"use strict";

var GENRES=["Pop","R&B","Hip Hop","Afrobeat","Electronic","Rock","Indie","Jazz","Soul","Latin","Country","Classical","Reggae","Metal","Folk","Blues"];
var COUNTRIES=["Afghanistan","Albania","Algeria","Argentina","Australia","Austria","Bangladesh","Belgium","Brazil","Canada","Chile","China","Colombia","Czech Republic","Denmark","Egypt","Ethiopia","Finland","France","Germany","Ghana","Greece","Hungary","India","Indonesia","Ireland","Israel","Italy","Jamaica","Japan","Kenya","Malaysia","Mexico","Morocco","Netherlands","New Zealand","Nigeria","Norway","Pakistan","Peru","Philippines","Poland","Portugal","Romania","Russia","Saudi Arabia","South Africa","South Korea","Spain","Sweden","Switzerland","Tanzania","Thailand","Turkey","UAE","Uganda","Ukraine","United Kingdom","United States","Vietnam","Zimbabwe"];

var step=1;
var totalSteps=5;
var form={
  stageName:"",legalName:"",email:"",phone:"",country:"",location:"",
  type:"Solo",genre:"Pop",bio:"",profileImage:"",coverImage:"",
  instagram:"",twitter:"",facebook:"",spotify:"",youtube:"",
  label:"",manager:"",sample:"",verificationInfo:"",
  terms:false
};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function $(s){return document.querySelector(s)}

function render(){
  var steps=[1,2,3,4,5];
  var labels=["Artist Info","Contact","Online Presence","Verify","Submit"];
  var stepper=steps.map(function(s){
    var cls=s<step?"done":s===step?"active":"";
    return '<div class="step '+cls+'"><div class="num">'+(s<step?"✓":s)+'</div><div class="label">'+labels[s-1]+'</div></div>';
  }).join("");

  var body="";
  if(step===1){
    body=sectionCard("Artist Information",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      '<div class="form-group"><label>Artist / Stage Name <span class="required">*</span></label><input id="fStageName" value="'+esc(form.stageName)+'" placeholder="Your stage or artist name"/></div>'+
      '<div class="form-group"><label>Legal Name <span class="required">*</span></label><input id="fLegalName" value="'+esc(form.legalName)+'" placeholder="Your full legal name"/></div>'+
      '<div class="form-row-3">'+
        '<div class="form-group"><label>Artist Type <span class="required">*</span></label><select id="fType"><option'+(form.type==="Solo"?" selected":"")+'>Solo</option><option'+(form.type==="Group"?" selected":"")+'>Group</option><option'+(form.type==="Band"?" selected":"")+'>Band</option></select></div>'+
        '<div class="form-group"><label>Primary Genre <span class="required">*</span></label><select id="fGenre">'+GENRES.map(function(g){return '<option'+(form.genre===g?" selected":"")+'>'+g+'</option>'}).join("")+'</select></div>'+
        '<div class="form-group"><label>Country <span class="required">*</span></label><select id="fCountry"><option value="">Select...</option>'+COUNTRIES.map(function(c){return '<option'+(form.country===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'+
      '</div>'+
      '<div class="form-group"><label>Location / City</label><input id="fLocation" value="'+esc(form.location)+'" placeholder="City, State/Province"/></div>'+
      '<div class="form-group"><label>Biography <span class="required">*</span></label><textarea id="fBio" placeholder="Tell us about yourself, your music, your journey...">'+esc(form.bio)+'</textarea><div class="hint">Max 2000 characters. This will appear on your public profile.</div></div>'
    );
  }else if(step===2){
    body=sectionCard("Contact Information",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
      '<div class="form-row"><div class="form-group"><label>Email Address <span class="required">*</span></label><input type="email" id="fEmail" value="'+esc(form.email)+'" placeholder="you@example.com"/></div><div class="form-group"><label>Phone Number</label><input id="fPhone" value="'+esc(form.phone)+'" placeholder="+1-555-000-0000"/></div></div>'+
      '<div class="form-row"><div class="form-group"><label>Management / Manager</label><input id="fManager" value="'+esc(form.manager)+'" placeholder="Manager name or N/A"/></div><div class="form-group"><label>Record Label</label><input id="fLabel" value="'+esc(form.label)+'" placeholder="Label name or Independent"/></div></div>'
    );
  }else if(step===3){
    body=sectionCard("Online Presence",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
      '<div class="form-row"><div class="form-group"><label>Instagram</label><input id="fIg" value="'+esc(form.instagram)+'" placeholder="@username"/></div><div class="form-group"><label>Twitter / X</label><input id="fTw" value="'+esc(form.twitter)+'" placeholder="@username"/></div></div>'+
      '<div class="form-row"><div class="form-group"><label>Facebook</label><input id="fFb" value="'+esc(form.facebook)+'" placeholder="Page URL or username"/></div><div class="form-group"><label>Spotify</label><input id="fSp" value="'+esc(form.spotify)+'" placeholder="Artist name"/></div></div>'+
      '<div class="form-group"><label>YouTube</label><input id="fYt" value="'+esc(form.youtube)+'" placeholder="Channel URL or name"/></div>'+
      '<div class="form-group"><label>Music Sample / Demo</label><input id="fSample" value="'+esc(form.sample)+'" placeholder="Link to your music (SoundCloud, YouTube, etc.)"/></div>'+
      '<div class="form-group"><label>Profile Image</label><div class="file-drop" id="profileDrop"><div class="file-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><h4>Upload profile photo</h4><p>JPG or PNG, min 800x800px</p></div><div class="file-info">✓ Image uploaded</div></div></div>'+
      '<div class="form-group"><label>Cover Image</label><div class="file-drop" id="coverDrop"><div class="file-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><h4>Upload cover photo</h4><p>Recommended 1500x500px</p></div><div class="file-info">✓ Image uploaded</div></div></div>'
    );
  }else if(step===4){
    body=sectionCard("Verification & Additional Info",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
      '<div class="form-group"><label>Verification Information</label><textarea id="fVerification" placeholder="Please provide any verification information: existing releases, press coverage, previous performances, music industry references, etc.">'+esc(form.verificationInfo)+'</textarea><div class="hint">Helps us verify your identity as a professional artist.</div></div>'+
      '<div class="form-group"><label>Terms & Conditions <span class="required">*</span></label>'+
        '<div class="checkbox-wrap"><input type="checkbox" id="fTerms"'+(form.terms?" checked":"")+'/><label for="fTerms">I agree to the <a href="#">Terms & Conditions</a>, <a href="#">Privacy Policy</a>, and <a href="#">Artist Agreement</a>. I confirm that all information provided is accurate and that I have the rights to distribute my music through OneBEAT.</label></div></div>'
    );
  }else if(step===5){
    body=sectionCard("Review Your Application",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
      '<div style="display:grid;gap:8px">'+
        row("Stage Name",form.stageName)||""+
        row("Legal Name",form.legalName||"—")+
        row("Type",form.type)+
        row("Genre",form.genre)+
        row("Country",form.country||"—")+
        row("Location",form.location||"—")+
        row("Email",form.email||"—")+
        row("Phone",form.phone||"—")+
        row("Bio",form.bio?(form.bio.substring(0,150)+(form.bio.length>150?"...":"")):"—")+
        row("Label",form.label||"Independent")+
        row("Manager",form.manager||"—")+
      '</div>'
    );
  }

  var actions="";
  if(step<=totalSteps){
    actions='<div class="form-actions">'+
      (step>1?'<button class="btn btn-ghost" id="prevBtn">← Previous</button>':'<div></div>')+
      (step<totalSteps?'<button class="btn btn-primary" id="nextBtn">Continue →</button>':'<button class="btn btn-primary" id="submitBtn">Submit Application</button>')+
    '</div>';
  }

  $("#formCard").innerHTML='<h1>Register as an Artist</h1><p class="subtitle">Join OneBEAT and share your music with the world.</p><div class="stepper">'+stepper+'</div>'+body+actions;
  bindEvents();
}

function sectionCard(title,icon,content){
  return '<div class="section-card"><h3>'+icon+' '+title+'</h3>'+content+'</div>';
}

function row(label,value){
  return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px"><span style="color:var(--muted)">'+esc(label)+'</span><strong>'+esc(value)+'</strong></div>';
}

function saveInputs(){
  var fields=[
    ["fStageName","stageName"],["fLegalName","legalName"],["fEmail","email"],
    ["fPhone","phone"],["fLocation","location"],["fBio","bio"],
    ["fIg","instagram"],["fTw","twitter"],["fFb","facebook"],
    ["fSp","spotify"],["fYt","youtube"],["fSample","sample"],
    ["fManager","manager"],["fLabel","label"],["fVerification","verificationInfo"]
  ];
  fields.forEach(function(pair){
    var el=$("#"+pair[0]);
    if(el)form[pair[1]]=el.value;
  });
  var typeEl=$("#fType");if(typeEl)form.type=typeEl.value;
  var genreEl=$("#fGenre");if(genreEl)form.genre=genreEl.value;
  var countryEl=$("#fCountry");if(countryEl)form.country=countryEl.value;
  var termsEl=$("#fTerms");if(termsEl)form.terms=termsEl.checked;
}

function bindEvents(){
  var next=$("#nextBtn");
  var prev=$("#prevBtn");
  var submit=$("#submitBtn");

  if(next)next.addEventListener("click",function(){
    saveInputs();
    if(step===1&&!form.stageName){alert("Please enter your stage name.");return}
    if(step===1&&!form.legalName){alert("Please enter your legal name.");return}
    if(step===2&&!form.email){alert("Please enter your email.");return}
    if(step<totalSteps){step++;render();window.scrollTo(0,0)}
  });
  if(prev)prev.addEventListener("click",function(){
    saveInputs();if(step>1){step--;render();window.scrollTo(0,0)}
  });
  if(submit)submit.addEventListener("click",function(){
    saveInputs();
    if(!form.terms){alert("Please agree to the terms and conditions.");return}
    // Save to localStorage for admin to see
    try{
      var apps=JSON.parse(localStorage.getItem("ob_admin_apps")||"[]");
      var colors=["linear-gradient(135deg,#a855f7,#ec4899)","linear-gradient(135deg,#60a5fa,#a78bfa)","linear-gradient(135deg,#34d399,#60a5fa)","linear-gradient(135deg,#fbbf24,#f97316)","linear-gradient(135deg,#f43f5e,#a855f7)"];
      apps.push({
        id:"app_"+Date.now(),
        stageName:form.stageName,
        email:form.email,
        phone:form.phone,
        country:form.country,
        location:form.location,
        type:form.type,
        genre:form.genre,
        bio:form.bio,
        status:"pending",
        regDate:new Date().toISOString().slice(0,10),
        avatar:colors[Math.floor(Math.random()*colors.length)]
      });
      localStorage.setItem("ob_admin_apps",JSON.stringify(apps));
    }catch(e){}
    renderSuccess();
  });

  // File drops
  var pd=$("#profileDrop");
  var cd=$("#coverDrop");
  if(pd)pd.addEventListener("click",function(){pd.classList.add("has-file")});
  if(cd)cd.addEventListener("click",function(){cd.classList.add("has-file")});
}

  $("#formCard").innerHTML=
    '<div class="success-view">'+
      '<div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>'+
      '<h1>Application Submitted!</h1>'+

      '<p style="font-size:13px">We\'ll review your application and notify you via email once a decision has been made.</p>'+
      '<div class="timeline">'+
        '<div class="timeline-item current"><div class="timeline-dot"></div><div class="tl-text"><strong>Application Submitted</strong><span>Your application is now in the review queue</span></div></div>'+
        '<div class="timeline-item"><div class="timeline-dot"></div><div class="tl-text"><strong>Under Review</strong><span>Our team will review your application</span></div></div>'+
        '<div class="timeline-item"><div class="timeline-dot"></div><div class="tl-text"><strong>Decision</strong><span>You\'ll receive an approval, rejection, or request for changes</span></div></div>'+
        '<div class="timeline-item"><div class="timeline-dot"></div><div class="tl-text"><strong>Artist Dashboard</strong><span>Once approved, you\'ll get access to your artist portal</span></div></div>'+
      '</div>'+
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:24px"><a href="index.html" class="btn btn-ghost">Back to Home</a><a href="app.html" class="btn btn-primary">Explore Music</a></div>'+
    '</div>';
}

render();
})();
</script>
